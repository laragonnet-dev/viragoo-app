<style>
:root{
  /* Layout: encabezado + pestañas fijas arriba; contenido en grillas de tarjetas; pie legal fijo abajo */
  /* Marca Viragoo: verde del logo #4E8F6F; los botones usan un tono más oscuro para que el texto blanco se lea bien */
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#f5f8f6; --ink:#141a17; --muted:#56635c; --line:#dde5e0;
  --brand:#4e8f6f; --accent:#3a7658; --accent-ink:#ffffff; --accent-soft:#e4f0e9;
  --ok:#2c7a30; --ok-soft:#e6f2e3; --warn:#965800; --warn-soft:#fff2d9; --bad:#bd2525; --bad-soft:#fce8e8;
  --cash:#1d6b86; --cash-soft:#e2f0f5; --card:#5b46b8; --card-soft:#eeeaff; --cc:#a1502a; --cc-soft:#f9ece4;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:12px; --shadow:0 1px 2px rgba(20,22,27,.06),0 6px 18px rgba(20,22,27,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1311; --surface:#161d1a; --surface-2:#1c2420; --ink:#ecf2ef; --muted:#9fb0a7; --line:#2a3530;
    --brand:#4e8f6f; --accent:#74c29b; --accent-ink:#0c1a13; --accent-soft:#1a3328;
    --ok:#7bd085; --ok-soft:#163019; --warn:#f1b64b; --warn-soft:#33270f; --bad:#ff8080; --bad-soft:#3b1717;
    --cash:#62bfdc; --cash-soft:#112b34; --card:#b3a4ff; --card-soft:#262046; --cc:#f0a47a; --cc-soft:#3a2418;
    --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1311; --surface:#161d1a; --surface-2:#1c2420; --ink:#ecf2ef; --muted:#9fb0a7; --line:#2a3530;
  --brand:#4e8f6f; --accent:#74c29b; --accent-ink:#0c1a13; --accent-soft:#1a3328;
  --ok:#7bd085; --ok-soft:#163019; --warn:#f1b64b; --warn-soft:#33270f; --bad:#ff8080; --bad-soft:#3b1717;
  --cash:#62bfdc; --cash-soft:#112b34; --card:#b3a4ff; --card-soft:#262046; --cc:#f0a47a; --cc-soft:#3a2418;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.45;padding-bottom:64px;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:26px;font-weight:700}
h3{font-size:19px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Encabezado */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:12px 0 6px}
.logo{width:44px;height:44px;border-radius:50%;flex:none;display:block}
.brand h1{font-size:23px;font-weight:700}
.brand .sub{font-size:13px;color:var(--muted)}
.brand .grow{flex:1;min-width:0}
.brand .grow h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:10px 14px;border:0;background:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;text-decoration:none}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:14px;border-radius:8px}
.btn.big{min-height:52px;font-size:17px;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{width:38px;height:38px;padding:0;min-height:38px}

/* Tarjetas y estructura */
main{padding:18px 0 24px}
.section-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .lbl{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-family:var(--display);font-size:clamp(20px,2.3vw,30px);font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .foot{font-size:13px;color:var(--muted)}
details.calc{margin-top:8px}
details.calc summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);list-style:none;display:inline-flex;align-items:center;gap:4px}
details.calc summary::-webkit-details-marker{display:none}
details.calc summary::before{content:"▸";font-size:11px;transition:transform .15s}
details.calc[open] summary::before{transform:rotate(90deg)}
ol.steps{margin:8px 0 0;padding:0;list-style:none;counter-reset:s;display:grid;gap:6px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:22px 1fr auto;gap:2px 8px;align-items:baseline;font-size:13.5px;padding:6px 8px;border-radius:8px;background:var(--surface-2)}
ol.steps li::before{content:counter(s);font-weight:700;color:var(--muted);font-size:12px}
ol.steps .t{font-weight:600}
ol.steps .f{grid-column:2/4;color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
ol.steps .r{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
ol.steps li.strong{background:var(--accent-soft)}
ol.steps li.note{grid-template-columns:22px 1fr}

/* Barra de herramientas */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1 1 240px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input[type=search]{padding-left:38px}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;min-height:42px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:160px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
select{appearance:auto}
.toolbar select{width:auto;min-width:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Inventario */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:10px;padding:14px;position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ok)}
.pcard.low::before{background:var(--warn)}
.pcard.out::before{background:var(--bad)}
.pcard .row1{display:flex;justify-content:space-between;gap:10px;align-items:start}
.pcard h3{font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.cash{background:var(--cash-soft);color:var(--cash)}
.pill.card{background:var(--card-soft);color:var(--card)}
.pill.cc{background:var(--cc-soft);color:var(--cc)}
.tabbadge{background:var(--cc);color:var(--surface);border-radius:999px;font-size:11.5px;padding:1px 7px;font-weight:700;line-height:1.5}
.tabbadge:empty{display:none}
.client{padding:14px 16px}
.client .chead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 14px}
.client .cname{font-family:var(--display);font-size:22px;font-weight:700}
.client .cdebt{font-family:var(--display);font-size:26px;font-weight:700;color:var(--cc);font-variant-numeric:tabular-nums}
.ccrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ccrow .nums{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;font-variant-numeric:tabular-nums}
.ccrow .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.quick{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:520px){.ccrow{grid-template-columns:1fr}.ccrow .acts{justify-content:flex-start}}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.stockbig{text-align:right}
.stockbig .n{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stockbig .u{font-size:12px;color:var(--muted)}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;border-top:1px dashed var(--line);padding-top:10px}
.prices .salebox{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;background:var(--accent-soft);border-radius:8px;padding:6px 10px}
.prices .salebox .l{white-space:nowrap}
.prices .l{font-size:12px;color:var(--muted);font-weight:600}
.prices .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.prices .v.sale{color:var(--accent);font-family:var(--display);font-size:24px;line-height:1.1}
.pcard .actions{display:flex;gap:8px;margin-top:auto}
.pcard .actions .btn{flex:1}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--surface-2);white-space:nowrap}
td.r,th.r{text-align:right}
td.num,td.r{font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* Venta */
.venta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.plist{display:flex;flex-direction:column;max-height:560px;overflow:auto;margin-top:12px;border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.prow .nm{font-weight:600}
.prow .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prow .right{display:flex;align-items:center;gap:10px}
.prow .price{font-weight:700;font-variant-numeric:tabular-nums}
.cart{display:flex;flex-direction:column;gap:8px}
.cline{display:grid;grid-template-columns:1fr auto auto;gap:8px 12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.cline .nm{font-weight:600}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{width:36px;height:38px;border:0;background:none;cursor:pointer;font-size:18px;font-weight:700}
.stepper input{width:48px;text-align:center;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;min-height:38px;padding:4px}
.paygroup{display:grid;gap:8px;margin:6px 0 12px}
.paygroup .glabel{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.paybtns{display:flex;flex-wrap:wrap;gap:8px}
.paybtn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;min-height:44px}
.paybtn.cash[aria-pressed="true"]{border-color:var(--cash);background:var(--cash-soft);color:var(--cash)}
.paybtn.card[aria-pressed="true"]{border-color:var(--card);background:var(--card-soft);color:var(--card)}
.paybtn.cc[aria-pressed="true"]{border-color:var(--cc);background:var(--cc-soft);color:var(--cc)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.flabel{font-size:13.5px;font-weight:600}
.field .hint{font-size:12.5px;color:var(--muted)}
.field .err{font-size:12.5px;color:var(--bad);font-weight:600}
.invalid input,.invalid select,input.invalid{border-color:var(--bad);background:var(--bad-soft)}
.total-box{border-radius:12px;padding:14px 16px;background:var(--ink);color:var(--bg)}
.total-box .lbl{font-size:13px;opacity:.8;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.total-box .big{font-family:var(--display);font-size:42px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.total-box .cuota{font-weight:600;font-variant-numeric:tabular-nums}
.lines{display:grid;gap:4px;margin-top:12px}
.line{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;padding:3px 0}
.line.em{font-weight:700;border-top:1px solid var(--line);padding-top:7px;margin-top:3px}
.errors{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600}
.errors ul{margin:4px 0 0;padding-left:18px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.infobox{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px}

/* Historial */
.split{height:14px;border-radius:999px;overflow:hidden;display:flex;background:var(--surface-2);border:1px solid var(--line)}
.split span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13.5px;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.salelist{display:flex;flex-direction:column;gap:10px}
.sale{padding:12px 14px}
.sale .head{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center}
.sale .nro{font-family:var(--display);font-weight:700;font-size:19px}
.sale .desc{min-width:0}
.sale .desc .items{font-weight:600;overflow-wrap:anywhere}
.sale .amt{text-align:right;font-variant-numeric:tabular-nums}
.sale .amt .t{font-weight:700;font-size:17px}
.sale.void{opacity:.6}
.sale.void .t{text-decoration:line-through}
.sale .body{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* Parámetros */
.ptable td{vertical-align:top}
.ptable input{min-width:90px}
.ptable td.val input{max-width:110px}
.ptable td.src input{min-width:220px}
.stack{display:grid;gap:16px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}

/* Banners, modal, toast, pie */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14.5px}
.banner.demo{background:var(--card-soft);color:var(--card)}
.banner.store{background:var(--bad-soft);color:var(--bad)}
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px 80px;overflow:auto}
.overlay[hidden]{display:none}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:680px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal.narrow{max-width:460px}
.modal header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal .mbody{padding:16px;display:grid;gap:14px}
.modal footer{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.pricebox{border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;margin:0;display:grid;gap:12px;background:var(--surface-2)}
.pricebox legend{font-family:var(--display);font-weight:700;font-size:18px;padding:0 6px}
.suggest{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.suggest .big{font-family:var(--display);font-size:32px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.check input{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:66px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);display:flex;gap:8px;align-items:center}
.toast[hidden]{display:none}
.legal{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);color:var(--bg);font-size:12.5px;text-align:center;padding:9px 16px calc(9px + env(safe-area-inset-bottom));font-weight:500}
.printonly{display:none}

@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .venta{grid-template-columns:1fr}
  .plist{max-height:340px}
  .sale .body{grid-template-columns:1fr}
}
@media (max-width:520px){
  body{font-size:15px}
  .fields{grid-template-columns:1fr}
  .kpi{padding:12px}
  .kpi .val{font-size:18px}
  .tab span.lbl-long{display:none}
  .sale .head{grid-template-columns:1fr auto}
  .sale .nro{grid-column:1/-1}
  .toolbar select{flex:1}
  .prices .v.sale{font-size:19px}
  .brand .sub .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#f6f6f6;--ink:#000;--muted:#444;--line:#ccc;color-scheme:light}
  body{padding:0;font-size:12px;background:#fff}
  .tabs,.toolbar,.btn,.banner,.no-print,.overlay,.toast,details.calc summary{display:none!important}
  .top{position:static;border:0}
  .panel{box-shadow:none;break-inside:avoid}
  .legal{position:static;background:none;color:#000;border-top:1px solid #000;margin-top:16px}
  .printonly{display:block}
  .venta{grid-template-columns:1fr}
  .plist{max-height:none}
}
</style>

<script>
"use strict";
/* =========================================================
   Utilidades de formato (Argentina)
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const round2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const group = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
function money(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  const v = round2(n); const neg = v < 0;
  const [i, d] = Math.abs(v).toFixed(2).split(".");
  return (neg ? "−" : "") + "$ " + group(i) + "," + d;
}
function pct(n) {
  if (n === null || n === undefined || n === "" || isNaN(n)) return "—";
  const v = round2(n); const s = Math.abs(v).toFixed(2).replace(/\.?0+$/, "");
  const [i, d] = s.split(".");
  return (v < 0 ? "−" : "") + group(i) + (d ? "," + d : "") + " %";
}
function intFmt(n) { return group(String(Math.round(n))); }
function numInput(n) {
  if (n === null || n === undefined || n === "" || isNaN(n)) return "";
  const [i, d] = round2(n).toFixed(2).split(".");
  return group(i) + (d === "00" ? "" : "," + d.replace(/0$/, ""));
}
function parseNum(v) {
  if (typeof v === "number") return v;
  let s = String(v ?? "").trim().replace(/\$|\s|%/g, "");
  if (s === "") return null;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  return parseFloat(s);
}
const pad2 = n => String(n).padStart(2, "0");
function isoOf(dt) { return dt.getFullYear() + "-" + pad2(dt.getMonth() + 1) + "-" + pad2(dt.getDate()); }
function todayISO() { return isoOf(new Date()); }
function addDays(iso, n) { const [y, m, d] = iso.split("-").map(Number); return isoOf(new Date(y, m - 1, d + n)); }
function fmtDate(iso) { if (!iso) return "—"; const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; }
function validISO(iso) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || "")) return false;
  const [y, m, d] = iso.split("-").map(Number); const dt = new Date(y, m - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d && y >= 2000 && y <= 2100;
}
function fmtTime(ts) { const d = new Date(ts); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();

/* CUIT / CUIL con dígito verificador (módulo 11) */
function validarCUIT(raw) {
  const s = String(raw || "").replace(/[-\s.]/g, "");
  if (!/^\d{11}$/.test(s)) return { ok: false, msg: "El CUIT/CUIL tiene que tener 11 números (por ejemplo 20-12345678-6)." };
  if (!/^(20|23|24|25|26|27|30|33|34)/.test(s)) return { ok: false, msg: "El CUIT/CUIL empieza con un prefijo que no existe (20, 23, 24, 27, 30, 33, 34…)." };
  const w = [5, 4, 3, 2, 7, 6, 5, 4, 3, 2];
  let sum = 0; for (let i = 0; i < 10; i++) sum += Number(s[i]) * w[i];
  let dv = 11 - (sum % 11); if (dv === 11) dv = 0;
  if (dv === 10 || dv !== Number(s[10])) return { ok: false, msg: "El dígito verificador del CUIT/CUIL no coincide. Revisá que esté bien copiado." };
  return { ok: true, fmt: s.slice(0, 2) + "-" + s.slice(2, 10) + "-" + s[10] };
}

/* Colores para el punto de color */
const COLOR_HEX = { negro:"#111", blanco:"#fff", gris:"#9aa0a6", "gris melange":"#b5b8bd", azul:"#2b53cf", "azul marino":"#1d2a5b", celeste:"#69b4f2", rosa:"#f39ab9", "rosa viejo":"#c98d93", fucsia:"#e0218a", rojo:"#d42a2a", bordo:"#7b1f2b", verde:"#2e8b57", "verde agua":"#43c6b4", "verde militar":"#5b6b3a", lila:"#b9a3e3", violeta:"#7a4fc2", naranja:"#f2811d", amarillo:"#f3c614", beige:"#d8c6a5", marron:"#7a5038", coral:"#ff7d6b" };
function colorDot(c) {
  const k = norm(c);
  if (k === "multicolor") return '<span class="dot" style="background:conic-gradient(#e33,#fc3,#3c6,#39f,#a4f,#e33)"></span>';
  const hex = COLOR_HEX[k] || COLOR_HEX[k.split(" ")[0]];
  return hex ? `<span class="dot" style="background:${hex}"></span>` : "";
}
const icon = (id, cls = "i") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;

/* =========================================================
   Medios de pago y parámetros
   ========================================================= */
const MEDIOS = {
  efectivo:      { label: "Efectivo",          grupo: "contado", tipo: "desc", pAj: "descEfectivo",      pCom: null },
  transferencia: { label: "Transferencia / QR", grupo: "contado", tipo: "desc", pAj: "descTransferencia", pCom: "comTransferencia" },
  debito:        { label: "Débito",            grupo: "contado", tipo: "desc", pAj: "descDebito",        pCom: "comDebito" },
  credito1:      { label: "Crédito 1 pago",    grupo: "credito", tipo: "rec",  pAj: "recCredito1",       pCom: "comCredito1" },
  cuotas:        { label: "Crédito en cuotas", grupo: "credito", tipo: "rec",  pAj: null,                pCom: null },
  ctacte:        { label: "Cuenta corriente",  grupo: "ctacte",  tipo: "rec",  pAj: "recCtaCte",         pCom: null }
};
const PARAM_DEFS = [
  { key: "iva",               label: "Alícuota general de IVA",                          max: 100, grupo: "Fiscal" },
  { key: "descEfectivo",      label: "Descuento por pago en efectivo",                   max: 100, grupo: "Comercial" },
  { key: "descTransferencia", label: "Descuento por transferencia / QR",                 max: 100, grupo: "Comercial" },
  { key: "descDebito",        label: "Descuento por débito",                             max: 100, grupo: "Comercial" },
  { key: "recCredito1",       label: "Recargo al cliente: crédito en 1 pago",            max: 500, grupo: "Comercial" },
  { key: "recCtaCte",         label: "Recargo al cliente: cuenta corriente",             max: 500, grupo: "Comercial" },
  { key: "comTransferencia",  label: "Comisión que te cobran: transferencia / QR",       max: 100, grupo: "Comercial" },
  { key: "comDebito",         label: "Comisión que te cobran: débito",                   max: 100, grupo: "Comercial" },
  { key: "comCredito1",       label: "Comisión que te cobran: crédito en 1 pago",        max: 100, grupo: "Comercial" }
];
const PAGO_MEDIOS = { efectivo: "Efectivo", transferencia: "Transferencia / QR", debito: "Débito" };
const FUENTE_COMERCIO = "Política comercial del negocio";
const FUENTE_PROCESADOR = "Tu contrato con el procesador de pagos (Mercado Pago, Getnet, Payway, banco, etc.)";
function defaultParams() {
  const hoy = todayISO();
  const ej = (valor, fuente) => ({ valor, vigencia: hoy, fuente, ejemplo: true });
  return {
    iva: { valor: 21, vigencia: "1998-12-31", fuente: "Ley 23.349 de IVA (t.o. 1997), art. 28, primer párrafo (texto según Ley 25.063). Verificado el 12/11/2026.", ejemplo: false },
    descEfectivo: ej(10, FUENTE_COMERCIO),
    descTransferencia: ej(5, FUENTE_COMERCIO),
    descDebito: ej(0, FUENTE_COMERCIO),
    recCredito1: ej(0, FUENTE_COMERCIO),
    comTransferencia: ej(0, FUENTE_PROCESADOR),
    comDebito: ej(1, FUENTE_PROCESADOR),
    comCredito1: ej(3, FUENTE_PROCESADOR),
    recCtaCte: { valor: 20, vigencia: hoy, fuente: "Planilla Virago, Hoja 2: precios diferenciados, “en dos, 20 % más si es cuenta corriente”.", ejemplo: false },
    planes: [
      { id: uid(), cuotas: 3,  recargo: 15, costo: 12, vigencia: hoy, fuente: FUENTE_PROCESADOR, ejemplo: true },
      { id: uid(), cuotas: 6,  recargo: 30, costo: 25, vigencia: hoy, fuente: FUENTE_PROCESADOR, ejemplo: true },
      { id: uid(), cuotas: 12, recargo: 60, costo: 50, vigencia: hoy, fuente: FUENTE_PROCESADOR, ejemplo: true }
    ]
  };
}
function pval(key) { const p = state.params[key]; if (!p) return null; const v = parseNum(p.valor); return v === null || isNaN(v) ? null : v; }

/* =========================================================
   Cálculos (puros, auditables)
   ========================================================= */
const Calc = {
  precioSugerido(costo, margen, modo, redondeo) {
    const steps = [];
    if (costo === null || isNaN(costo) || margen === null || isNaN(margen)) return { error: "Completá costo y margen para ver el precio sugerido.", steps };
    let bruto;
    if (modo === "precio") {
      if (margen >= 100) return { error: "Con margen sobre el precio de venta, el porcentaje tiene que ser menor a 100 %.", steps };
      bruto = costo / (1 - margen / 100);
      steps.push({ t: "Precio para que la ganancia sea " + pct(margen) + " del precio de venta", f: `${money(costo)} ÷ (1 − ${pct(margen)})`, r: money(bruto) });
    } else {
      bruto = costo * (1 + margen / 100);
      steps.push({ t: "Costo más " + pct(margen) + " de ganancia sobre el costo", f: `${money(costo)} × (1 + ${pct(margen)})`, r: money(bruto) });
    }
    let precio = round2(bruto);
    if (redondeo > 0) {
      const red = Math.ceil(round2(precio) / redondeo - 1e-9) * redondeo;
      steps.push({ t: "Redondeo hacia arriba al múltiplo de " + money(redondeo), f: `${money(precio)} → múltiplo de ${money(redondeo)}`, r: money(red) });
      precio = red;
    }
    const ganancia = round2(precio - costo);
    const sobreCosto = costo > 0 ? ganancia / costo * 100 : null;
    const sobrePrecio = precio > 0 ? ganancia / precio * 100 : null;
    steps.push({ t: "Ganancia por unidad", f: `${money(precio)} − ${money(costo)}`, r: money(ganancia), strong: true });
    if (sobreCosto !== null) steps.push({ t: "Margen real sobre el costo", f: `${money(ganancia)} ÷ ${money(costo)}`, r: pct(sobreCosto) });
    if (sobrePrecio !== null) steps.push({ t: "Margen real sobre el precio de venta", f: `${money(ganancia)} ÷ ${money(precio)}`, r: pct(sobrePrecio) });
    return { precio, bruto, ganancia, sobreCosto, sobrePrecio, steps };
  },

  venta(inp) {
    const m = MEDIOS[inp.medio]; const steps = []; const warn = [];
    let subtotal = 0; const terms = [];
    inp.items.forEach(it => { subtotal = round2(subtotal + round2(it.precio * it.cantidad)); terms.push(`${it.cantidad} × ${money(it.precio)}`); });
    steps.push({ t: "Subtotal a precio de lista", f: terms.join(" + ") || "Sin productos", r: money(subtotal) });
    const aj = inp.ajustePct === null || isNaN(inp.ajustePct) ? 0 : inp.ajustePct;
    const esRec = m.tipo === "rec";
    const ajMonto = round2(subtotal * aj / 100);
    const ajusteMonto = esRec ? ajMonto : -ajMonto;
    const ajLabel = esRec ? (inp.medio === "cuotas" ? `Recargo por ${inp.cuotas} cuotas` : inp.medio === "ctacte" ? "Recargo por cuenta corriente" : "Recargo por crédito en 1 pago") : `Descuento por ${m.label.toLowerCase()}`;
    steps.push({ t: ajLabel, f: `${money(subtotal)} × ${pct(aj)}`, r: (esRec ? "+ " : "− ") + money(ajMonto) });
    const total = round2(subtotal + ajusteMonto);
    steps.push({ t: "Total que cobrás", f: `${money(subtotal)} ${esRec ? "+" : "−"} ${money(ajMonto)}`, r: money(total), strong: true });
    let valorCuota = null;
    if ((inp.medio === "cuotas" || inp.medio === "ctacte") && inp.cuotas > 1) {
      valorCuota = round2(total / inp.cuotas);
      steps.push({ t: inp.medio === "ctacte" ? "Valor de cada pago" : "Valor de cada cuota para el cliente", f: `${money(total)} ÷ ${inp.cuotas}`, r: money(valorCuota) });
    }
    let saldo = null;
    if (inp.medio === "ctacte") {
      const ent = inp.entrega === null || inp.entrega === undefined || isNaN(inp.entrega) ? 0 : inp.entrega;
      saldo = round2(total - ent);
      steps.push({ t: "Entrega el día de la compra", f: ent ? "Lo que deja hoy" : "No deja nada hoy", r: money(ent) });
      steps.push({ t: "Queda en cuenta corriente (lo que te debe)", f: `${money(total)} − ${money(ent)}`, r: money(saldo), strong: true });
    }
    const c = inp.comisionPct === null || isNaN(inp.comisionPct) ? 0 : inp.comisionPct;
    const comision = round2(total * c / 100);
    steps.push({ t: inp.medio === "cuotas" ? "Costo para vos (comisión + financiación)" : "Comisión del medio de pago", f: `${money(total)} × ${pct(c)}`, r: "− " + money(comision) });
    const neto = round2(total - comision);
    steps.push({ t: "Ingreso neto estimado (lo que te queda)", f: `${money(total)} − ${money(comision)}`, r: money(neto), strong: true });
    let costo = 0; const cterms = [];
    inp.items.forEach(it => { costo = round2(costo + round2(it.costo * it.cantidad)); cterms.push(`${it.cantidad} × ${money(it.costo)}`); });
    steps.push({ t: "Costo de la mercadería vendida", f: cterms.join(" + ") || "—", r: money(costo) });
    const ganancia = round2(neto - costo);
    steps.push({ t: "Ganancia estimada (antes de impuestos)", f: `${money(neto)} − ${money(costo)}`, r: money(ganancia), strong: true });
    let iva = null;
    if (inp.ri) {
      if (inp.ivaPct === null || inp.ivaPct === undefined || isNaN(inp.ivaPct)) warn.push("Falta la alícuota de IVA en Parámetros: no se calculó el IVA contenido.");
      else {
        iva = round2(total - total / (1 + inp.ivaPct / 100));
        steps.push({ t: "IVA contenido en el total (informativo)", f: `${money(total)} − ${money(total)} ÷ (1 + ${pct(inp.ivaPct)})`, r: money(iva) });
      }
    }
    return { subtotal, ajusteMonto, total, valorCuota, saldo, comision, neto, costo, ganancia, iva, steps, warn };
  }
};
function stepsHTML(steps, open = false, label = "Ver cálculo paso a paso") {
  if (!steps || !steps.length) return "";
  return `<details class="calc"${open ? " open" : ""}><summary>${label}</summary><ol class="steps">${steps.map(s =>
    s.note ? `<li class="note"><span class="t">${esc(s.t)}</span></li>` :
    `<li class="${s.strong ? "strong" : ""}"><span class="t">${esc(s.t)}</span><span class="r">${esc(s.r)}</span><span class="f">${esc(s.f)}</span></li>`).join("")}</ol></details>`;
}

/* =========================================================
   Estado y almacenamiento local
   ========================================================= */
const STORE_KEY = "stock-ventas-deportivas.v1";
let storageOK = true;
function emptyState() {
  return { v: 1, demo: false, seq: 0, skuSeq: 0,
    config: { negocio: "Viragoo Indumentaria", condIva: "mono", stockBajo: 2, redondeo: 100, vista: "cards" },
    params: defaultParams(), products: [], sales: [] };
}
function loadState() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) return normalizeState(JSON.parse(raw)); }
  catch (e) { storageOK = false; }
  return null;
}
function normalizeState(s) {
  const base = emptyState();
  if (!s || typeof s !== "object" || !Array.isArray(s.products) || !Array.isArray(s.sales)) throw new Error("formato");
  const params = Object.assign(base.params, s.params || {});
  if (!Array.isArray(params.planes)) params.planes = [];
  return Object.assign(base, s, { config: Object.assign(base.config, s.config || {}), params });
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); storageOK = true; }
  catch (e) { storageOK = false; }
}
function skuFor(cat) {
  state.skuSeq = (state.skuSeq || 0) + 1;
  const pre = norm(cat).replace(/[^a-z]/g, "").slice(0, 3).toUpperCase() || "PRD";
  return pre + "-" + String(state.skuSeq).padStart(3, "0");
}
function buildProduct(d) {
  const r = Calc.precioSugerido(d.costo, d.margen, d.modo, d.redondeo);
  return { id: uid(), sku: skuFor(d.categoria), nombre: d.nombre, categoria: d.categoria, talle: d.talle, color: d.color, stock: d.stock,
    costo: d.costo, modo: d.modo, margen: d.margen, redondeo: d.redondeo, manual: !!d.manual,
    precio: d.manual ? d.precioManual : r.precio, actualizado: Date.now() };
}
function demoState() {
  const s = emptyState(); state = s; s.demo = true;
  const mk = (nombre, categoria, talle, color, stock, costo, margen, modo = "costo") =>
    buildProduct({ nombre, categoria, talle, color, stock, costo, margen, modo, redondeo: 100 });
  s.products = [
    mk("Calza deportiva tiro alto", "Calzas", "M", "Negro", 8, 18000, 90),
    mk("Top deportivo soft", "Tops", "S", "Rosa", 3, 9500, 100),
    mk("Remera dry-fit running", "Remeras", "L", "Azul", 14, 7800, 110),
    mk("Buzo con capucha", "Buzos", "M", "Gris", 5, 26000, 45, "precio"),
    mk("Short running con calza", "Shorts", "M", "Negro", 0, 8200, 95)
  ];
  const [calza, top, remera, buzo] = s.products;
  const plan3 = s.params.planes[0];
  registrarVenta({ fecha: addDays(todayISO(), -3), medio: "debito", cuotas: 1, ajustePct: 0, comisionPct: 1, cliente: "", cuit: "", nota: "",
    lines: [{ productId: buzo.id, cantidad: 1 }] }, true);
  registrarVenta({ fecha: addDays(todayISO(), -1), medio: "cuotas", cuotas: plan3.cuotas, ajustePct: plan3.recargo, comisionPct: plan3.costo, cliente: "Laura (ejemplo)", cuit: "", nota: "",
    lines: [{ productId: remera.id, cantidad: 2 }, { productId: top.id, cantidad: 1 }] }, true);
  registrarVenta({ fecha: todayISO(), medio: "efectivo", cuotas: 1, ajustePct: 10, comisionPct: 0, cliente: "", cuit: "", nota: "",
    lines: [{ productId: calza.id, cantidad: 1 }] }, true);
  registrarVenta({ fecha: addDays(todayISO(), -10), medio: "ctacte", cuotas: 2, ajustePct: 20, comisionPct: 0, cliente: "Marina (ejemplo)", cuit: "", nota: "",
    entrega: 20520, entregaMedio: "efectivo", lines: [{ productId: calza.id, cantidad: 1 }] }, true);
  return s;
}

/* Registra la venta y descuenta stock. Devuelve {ok, errors, sale}. */
function registrarVenta(v, silent) {
  const errors = [];
  if (!v.lines.length) errors.push("Agregá al menos un producto a la venta.");
  const pedidas = {};
  v.lines.forEach(l => { pedidas[l.productId] = (pedidas[l.productId] || 0) + l.cantidad; });
  Object.entries(pedidas).forEach(([id, q]) => {
    const p = state.products.find(x => x.id === id);
    if (!p) errors.push("Un producto del carrito ya no existe en el inventario.");
    else if (!Number.isInteger(q) || q < 1) errors.push(`La cantidad de "${p.nombre}" tiene que ser un número entero mayor a 0.`);
    else if (q > p.stock) errors.push(`No hay stock suficiente de "${p.nombre} ${p.talle}": pediste ${q} y quedan ${p.stock}.`);
  });
  if (!validISO(v.fecha)) errors.push("La fecha de la venta no es válida.");
  else if (v.fecha > todayISO()) errors.push("La fecha de la venta no puede ser posterior a hoy.");
  const m = MEDIOS[v.medio];
  if (!m) errors.push("Elegí una forma de pago.");
  if (v.ajustePct === null || isNaN(v.ajustePct) || v.ajustePct < 0) errors.push(`El ${m && m.tipo === "rec" ? "recargo" : "descuento"} tiene que ser un porcentaje igual o mayor a 0.`);
  else if (m && m.tipo === "desc" && v.ajustePct >= 100) errors.push("El descuento tiene que ser menor a 100 %.");
  else if (v.ajustePct > 500) errors.push("El recargo no puede superar 500 %.");
  if (v.comisionPct === null || isNaN(v.comisionPct) || v.comisionPct < 0 || v.comisionPct >= 100) errors.push("La comisión / costo para vos tiene que estar entre 0 % y 99,99 %.");
  if (v.medio === "cuotas" && (!Number.isInteger(v.cuotas) || v.cuotas < 2)) errors.push("Elegí un plan de cuotas (2 o más).");
  const entrega = v.medio === "ctacte" ? (v.entrega === null || v.entrega === undefined ? 0 : v.entrega) : 0;
  if (v.medio === "ctacte") {
    if (!String(v.cliente || "").trim()) errors.push("Para cuenta corriente escribí el nombre de la clienta: así sabés quién te debe.");
    if (!Number.isInteger(v.cuotas) || v.cuotas < 1 || v.cuotas > 12) errors.push("La cantidad de pagos tiene que ser un número entero entre 1 y 12.");
    if (isNaN(entrega) || entrega < 0) errors.push("La entrega de hoy tiene que ser un importe igual o mayor a 0.");
    if (!PAGO_MEDIOS[v.entregaMedio || "efectivo"]) errors.push("Elegí cómo paga la entrega de hoy.");
  }
  let cuitFmt = "";
  if (v.cuit && v.cuit.trim()) { const c = validarCUIT(v.cuit); if (!c.ok) errors.push(c.msg); else cuitFmt = c.fmt; }
  if (errors.length) return { ok: false, errors };

  const items = v.lines.map(l => { const p = state.products.find(x => x.id === l.productId);
    return { productId: p.id, sku: p.sku, nombre: p.nombre, talle: p.talle, color: p.color, cantidad: l.cantidad, precio: p.precio, costo: p.costo }; });
  const ri = state.config.condIva === "ri"; const ivaPct = pval("iva");
  const res = Calc.venta({ items, medio: v.medio, cuotas: v.cuotas, ajustePct: v.ajustePct, comisionPct: v.comisionPct, ri, ivaPct, entrega });
  if (v.medio === "ctacte" && entrega > res.total + 0.004) return { ok: false, errors: [`La entrega de hoy (${money(entrega)}) no puede ser mayor que el total (${money(res.total)}).`] };
  items.forEach(it => { const p = state.products.find(x => x.id === it.productId); p.stock -= it.cantidad; });
  state.seq += 1;
  const sale = { id: uid(), n: state.seq, fecha: v.fecha, ts: Date.now(), cliente: (v.cliente || "").trim(), cuit: cuitFmt, nota: (v.nota || "").trim(),
    medio: v.medio, cuotas: (v.medio === "cuotas" || v.medio === "ctacte") ? v.cuotas : 1, ajustePct: v.ajustePct, comisionPct: v.comisionPct, ri, ivaPct, items,
    res: { subtotal: res.subtotal, ajusteMonto: res.ajusteMonto, total: res.total, valorCuota: res.valorCuota, comision: res.comision, neto: res.neto, costo: res.costo, ganancia: res.ganancia, iva: res.iva },
    anulada: false };
  if (v.medio === "ctacte") { sale.entrega = round2(entrega); sale.pagos = entrega > 0 ? [{ id: uid(), fecha: v.fecha, monto: round2(entrega), medio: v.entregaMedio || "efectivo", nota: "Entrega el día de la compra", ts: Date.now() }] : []; }
  state.sales.push(sale);
  if (!silent) save();
  return { ok: true, sale };
}
function recomputeSale(s) { return Calc.venta({ items: s.items, medio: s.medio, cuotas: s.cuotas, ajustePct: s.ajustePct, comisionPct: s.comisionPct, ri: s.ri, ivaPct: s.ivaPct, entrega: s.entrega || 0 }); }
const pagadoVenta = s => round2((s.pagos || []).reduce((a, p) => a + p.monto, 0));
const saldoVenta = s => s.medio === "ctacte" && !s.anulada ? round2(s.res.total - pagadoVenta(s)) : 0;
const diasDesde = iso => { const [y, m, d] = iso.split("-").map(Number); const [y2, m2, d2] = todayISO().split("-").map(Number); return Math.round((new Date(y2, m2 - 1, d2) - new Date(y, m - 1, d)) / 86400000); };

function stockState(p) { if (p.stock <= 0) return "out"; if (p.stock <= (Number(state.config.stockBajo) || 0)) return "low"; return "ok"; }
function stockPill(p) {

function priceSteps(p) {
  const r = Calc.precioSugerido(p.costo, p.margen, p.modo, p.redondeo);
  const steps = r.steps.slice();
  if (p.manual) {
    const g = round2(p.precio - p.costo);
    return [{ t: "Precio sugerido por la fórmula", f: `${p.modo === "precio" ? "margen sobre precio" : "margen sobre costo"} ${pct(p.margen)}`, r: money(r.precio) },
      { t: "Precio de venta fijado a mano", f: "Elegiste otro precio al cargar el producto", r: money(p.precio), strong: true },
      { t: "Ganancia por unidad", f: `${money(p.precio)} − ${money(p.costo)}`, r: money(g) },
      ...(p.costo > 0 ? [{ t: "Margen real sobre el costo", f: `${money(g)} ÷ ${money(p.costo)}`, r: pct(g / p.costo * 100) }] : [])];
  }
  return steps;
}
function filteredProducts() {
  const q = norm(inv.q);
  return state.products.filter(p => {
    if (inv.cat && p.categoria !== inv.cat) return false;

    return true;

const hf = { periodo: "mes", desde: addDays(todayISO(), -30), hasta: todayISO(), medio: "", anuladas: false, abiertas: new Set() };
function rangoPeriodo() {
  const hoy = todayISO(); const [y, m] = hoy.split("-").map(Number);
  switch (hf.periodo) {
    case "hoy": return [hoy, hoy];
    case "7": return [addDays(hoy, -6), hoy];
    case "mes": return [`${y}-${pad2(m)}-01`, hoy];
    case "mesant": { const d = new Date(y, m - 2, 1); const fin = new Date(y, m - 1, 0); return [isoOf(d), isoOf(fin)]; }
    case "rango": return [hf.desde, hf.hasta];
    default: return ["0000-00-00", "9999-12-31"];
  }
}
function ventasFiltradas() {
  const [d, h] = rangoPeriodo();
  return state.sales.filter(s => s.fecha >= d && s.fecha <= h && (!hf.medio || (hf.medio === "contado" ? MEDIOS[s.medio].grupo === "contado" : hf.medio === "credito" ? MEDIOS[s.medio].grupo === "credito" : s.medio === hf.medio)) && (hf.anuladas || !s.anulada))
    .sort((a, b) => b.fecha.localeCompare(a.fecha) || b.n - a.n);
}
function medioPill(s) {
  const m = MEDIOS[s.medio];
  if (s.medio === "cuotas") return `<span class="pill card">${icon("credit")}${s.cuotas} cuotas de ${money(s.res.valorCuota)}</span>`;
  if (s.medio === "ctacte") { const sd = saldoVenta(s);
    return `<span class="pill cc">${icon("ledger")}Cta. cte.${s.cuotas > 1 ? ` · ${s.cuotas} pagos de ${money(s.res.valorCuota)}` : ""}</span>${s.anulada ? "" : sd > 0.004 ? `<span class="pill warn">Debe ${money(sd)}</span>` : '<span class="pill ok">Saldada</span>'}`; }
  return `<span class="pill ${m.grupo === "contado" ? "cash" : "card"}">${icon(m.grupo === "contado" ? "cash" : "credit")}${m.label}</span>`;
}
function historialResumen(list) {
  const act = list.filter(s => !s.anulada);
  const sum = k => round2(act.reduce((a, s) => a + s.res[k], 0));
  const total = sum("total"), neto = sum("neto"), gan = sum("ganancia");
  const cont = round2(act.filter(s => MEDIOS[s.medio].grupo === "contado").reduce((a, s) => a + s.res.total, 0));
  const c1 = round2(act.filter(s => s.medio === "credito1").reduce((a, s) => a + s.res.total, 0));
  const cuo = round2(act.filter(s => s.medio === "cuotas").reduce((a, s) => a + s.res.total, 0));
  const ccT = round2(act.filter(s => s.medio === "ctacte").reduce((a, s) => a + s.res.total, 0));
  const pend = round2(act.reduce((a, s) => a + saldoVenta(s), 0));
  const unidades = act.reduce((a, s) => a + s.items.reduce((b, i) => b + i.cantidad, 0), 0);
  const w = x => total > 0 ? (x / total * 100) : 0;
  const terms = k => act.map(s => money(s.res[k])).join(" + ") || "0";
  const porMedio = Object.keys(MEDIOS).map(k => { const l = act.filter(s => s.medio === k); return { k, n: l.length, total: round2(l.reduce((a, s) => a + s.res.total, 0)), neto: round2(l.reduce((a, s) => a + s.res.neto, 0)) }; }).filter(x => x.n);
  return `<div class="kpis">
    <div class="panel kpi"><div class="lbl">Ventas</div><div class="val">${act.length}</div><div class="foot">${intFmt(unidades)} unidades vendidas</div></div>
    <div class="panel kpi"><div class="lbl">Total vendido</div><div class="val">${money(total)}</div><div class="foot">${pend > 0.004 ? `${money(pend)} todavía en cuenta corriente` : "Incluye recargos"}</div>${stepsHTML([{ t: "Suma de lo cobrado en cada venta", f: terms("total"), r: money(total), strong: true }], false, "Ver cálculo")}</div>
    <div class="panel kpi"><div class="lbl">Ingreso neto</div><div class="val">${money(neto)}</div><div class="foot">Después de comisiones</div>${stepsHTML([{ t: "Suma del neto de cada venta", f: terms("neto"), r: money(neto), strong: true }, { t: "Comisiones y costos financieros", f: `${money(total)} − ${money(neto)}`, r: money(total - neto) }], false, "Ver cálculo")}</div>
    <div class="panel kpi"><div class="lbl">Ganancia estimada</div><div class="val" style="color:${gan < 0 ? "var(--bad)" : "var(--ok)"}">${money(gan)}</div><div class="foot">Neto menos costo de mercadería</div>${stepsHTML([{ t: "Suma de la ganancia de cada venta", f: terms("ganancia"), r: money(gan), strong: true }], false, "Ver cálculo")}</div>
  </div>
  <div class="panel pad" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><h3>Cómo te pagaron</h3><span class="small muted">Sobre el total cobrado del período</span></div>
    <div class="split" style="margin-top:10px" role="img" aria-label="Contado ${pct(w(cont))}, crédito 1 pago ${pct(w(c1))}, cuotas ${pct(w(cuo))}"><span style="width:${w(cont)}%;background:var(--cash)"></span><span style="width:${w(c1)}%;background:color-mix(in srgb,var(--card) 55%,var(--surface))"></span><span style="width:${w(cuo)}%;background:var(--card)"></span><span style="width:${w(ccT)}%;background:var(--cc)"></span></div>
    <div class="legend"><span><i style="background:var(--cash)"></i>Contado <b>${money(cont)}</b> (${pct(w(cont))})</span><span><i style="background:color-mix(in srgb,var(--card) 55%,var(--surface))"></i>Crédito 1 pago <b>${money(c1)}</b> (${pct(w(c1))})</span><span><i style="background:var(--card)"></i>Cuotas <b>${money(cuo)}</b> (${pct(w(cuo))})</span><span><i style="background:var(--cc)"></i>Cuenta corriente <b>${money(ccT)}</b> (${pct(w(ccT))})</span></div>
    ${porMedio.length ? `<div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Medio</th><th class="r">Ventas</th><th class="r">Cobrado</th><th class="r">Neto</th></tr></thead><tbody>${porMedio.map(x => `<tr><td>${MEDIOS[x.k].label}</td><td class="r">${x.n}</td><td class="r">${money(x.total)}</td><td class="r">${money(x.neto)}</td></tr>`).join("")}</tbody></table></div>` : ""}
  </div>`;
}
function saleHTML(s) {
  const open = hf.abiertas.has(s.id);
  const itemsTxt = s.items.map(i => `${i.cantidad} × ${i.nombre} (${i.talle}, ${i.color})`).join(" · ");
  return `<article class="panel sale ${s.anulada ? "void" : ""}">
    <div class="head"><div class="nro">#${String(s.n).padStart(4, "0")}</div>
      <div class="desc"><div class="items">${esc(itemsTxt)}</div><div class="small muted" style="display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:3px"><span>${fmtDate(s.fecha)}${s.importada ? "" : " · " + fmtTime(s.ts)}</span>${s.importada ? '<span class="pill neutral">De la planilla</span>' : ""}${medioPill(s)}${s.anulada ? '<span class="pill bad">Anulada</span>' : ""}${s.cliente ? `<span>${esc(s.cliente)}</span>` : ""}</div></div>
      <div class="amt"><div class="t">${money(s.res.total)}</div><div class="small muted">neto ${money(s.res.neto)}</div>
        <button class="btn sm ghost no-print" data-act="sale-toggle" data-id="${s.id}" aria-expanded="${open}">${open ? "Ocultar" : "Ver detalle"}</button></div></div>
    ${open ? `<div class="body"><div>
        <div class="tablewrap"><table><thead><tr><th>Producto</th><th class="r">Cant.</th><th class="r">Precio</th><th class="r">Subtotal</th></tr></thead><tbody>
        ${s.items.map(i => `<tr><td>${esc(i.nombre)}<div class="small muted">${esc(i.talle)} · ${esc(i.color)} · ${esc(i.sku || "")}</div></td><td class="r">${i.cantidad}</td><td class="r">${money(i.precio)}</td><td class="r">${money(i.precio * i.cantidad)}</td></tr>`).join("")}</tbody></table></div>
        <div class="small" style="margin-top:10px;display:grid;gap:4px">${s.cuit ? `<div>CUIT/CUIL: <b>${esc(s.cuit)}</b></div>` : ""}${s.nota ? `<div>Nota: ${esc(s.nota)}</div>` : ""}${s.ri ? `<div class="muted">Condición al registrar: Responsable Inscripto (IVA ${pct(s.ivaPct)})</div>` : ""}</div>
        ${s.medio === "ctacte" ? pagosHTML(s) : ""}
        ${s.anulada ? `<div class="infobox small" style="margin-top:10px">Anulada el ${fmtDate(isoOf(new Date(s.anuladaTs)))}. El stock se repuso.</div>` : `<button class="btn sm danger no-print" style="margin-top:12px" data-act="sale-void" data-id="${s.id}">${icon("x")}Anular venta y reponer stock</button>`}
      </div><div>${stepsHTML(recomputeSale(s).steps, true)}</div></div>` : ""}
  </article>`;
}
VIEWS.historial = {
  html() {
    const list = ventasFiltradas(); const [d, h] = rangoPeriodo();
    const opt = (v, l, cur) => `<option value="${v}" ${v === cur ? "selected" : ""}>${l}</option>`;
    return `<div class="section-head"><div><h2>Historial de ventas</h2><div class="muted small">${hf.periodo === "todo" ? "Todas las ventas" : `Del ${fmtDate(d)} al ${fmtDate(h)}`}${hf.medio ? " · filtrado por medio de pago" : ""}</div></div></div>
    <div class="toolbar">
      <select id="hPer" aria-label="Período">${opt("hoy", "Hoy", hf.periodo)}${opt("7", "Últimos 7 días", hf.periodo)}${opt("mes", "Este mes", hf.periodo)}${opt("mesant", "Mes anterior", hf.periodo)}${opt("todo", "Todo", hf.periodo)}${opt("rango", "Elegir fechas…", hf.periodo)}</select>
      ${hf.periodo === "rango" ? `<label class="small" style="display:flex;align-items:center;gap:6px">Desde <input type="date" id="hDesde" value="${hf.desde}" style="width:auto"></label><label class="small" style="display:flex;align-items:center;gap:6px">Hasta <input type="date" id="hHasta" value="${hf.hasta}" style="width:auto"></label>` : ""}
      <select id="hMed" aria-label="Medio de pago">${opt("", "Todos los medios", hf.medio)}${opt("contado", "Solo contado", hf.medio)}${opt("credito", "Solo crédito (1 pago y cuotas)", hf.medio)}${Object.keys(MEDIOS).map(k => opt(k, MEDIOS[k].label, hf.medio)).join("")}</select>
      <label class="check small"><input type="checkbox" id="hAnu" ${hf.anuladas ? "checked" : ""}> Mostrar anuladas</label>
    </div>
    ${hf.periodo === "rango" && (!validISO(hf.desde) || !validISO(hf.hasta) || hf.desde > hf.hasta) ? `<div class="errors" style="margin-bottom:12px">Revisá las fechas: “desde” tiene que ser una fecha válida anterior o igual a “hasta”.</div>` : ""}
    ${historialResumen(list)}
    <div class="salelist">${list.length ? list.map(saleHTML).join("") : `<div class="panel empty"><h3>No hay ventas en este período</h3><p>Cambiá el período o <a href="#venta">cargá una venta</a>.</p></div>`}</div>`;
  },
  mount() {
    $("#hPer").addEventListener("change", e => { hf.periodo = e.target.value; render(); });
    $("#hMed").addEventListener("change", e => { hf.medio = e.target.value; render(); });
    $("#hAnu").addEventListener("change", e => { hf.anuladas = e.target.checked; render(); });
    const d = $("#hDesde"), h = $("#hHasta");
    if (d) d.addEventListener("change", e => { hf.desde = e.target.value; render(); });
    if (h) h.addEventListener("change", e => { hf.hasta = e.target.value; render(); });
  }
};

/* =========================================================
   Vista: Cuenta corriente (lo que te deben)
   ========================================================= */
const cf = { q: "", saldadas: false, abiertas: new Set() };
function pagosHTML(s, conBoton = true) {
  const pg = pagadoVenta(s), sd = saldoVenta(s);
  const pasos = [{ t: "Total de la venta", f: "Incluye el recargo por cuenta corriente", r: money(s.res.total) },
    ...(s.pagos || []).map(p => ({ t: `Pago del ${fmtDate(p.fecha)} (${PAGO_MEDIOS[p.medio] || p.medio})`, f: p.nota || "", r: "− " + money(p.monto) })),
    { t: s.anulada ? "Venta anulada" : "Saldo que te debe", f: `${money(s.res.total)} − ${money(pg)}`, r: money(s.anulada ? 0 : sd), strong: true }];
  return `<div style="margin-top:12px"><div class="flabel">Pagos</div>
    ${(s.pagos || []).length ? `<div class="tablewrap" style="margin-top:6px"><table><thead><tr><th>Fecha</th><th>Medio</th><th class="r">Monto</th><th class="no-print"></th></tr></thead><tbody>
      ${s.pagos.map(p => `<tr><td>${fmtDate(p.fecha)}${p.nota ? `<div class="small muted">${esc(p.nota)}</div>` : ""}</td><td>${esc(PAGO_MEDIOS[p.medio] || p.medio)}</td><td class="r">${money(p.monto)}</td>
        <td class="no-print">${s.anulada ? "" : `<button class="btn sm ghost iconbtn" data-act="pago-del" data-id="${s.id}" data-pago="${p.id}" aria-label="Quitar este pago">${icon("trash")}</button>`}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="small muted" style="margin-top:4px">Todavía no registraste pagos.</div>`}
    ${stepsHTML(pasos, false, "Ver cálculo del saldo")}
    ${conBoton && !s.anulada && sd > 0.004 ? `<button class="btn sm primary no-print" style="margin-top:10px" data-act="pago-new" data-id="${s.id}">${icon("cash")}Registrar pago</button>` : ""}</div>`;
}
function ccRow(s) {
  const pg = pagadoVenta(s), sd = saldoVenta(s), d = diasDesde(s.fecha), open = cf.abiertas.has(s.id);
  const itemsTxt = s.items.map(i => `${i.cantidad} × ${i.nombre} (${i.talle}, ${i.color})`).join(" · ");
  return `<div class="ccrow"><div style="min-width:0"><div style="font-weight:600;overflow-wrap:anywhere">#${String(s.n).padStart(4, "0")} · ${esc(itemsTxt)}</div>
      <div class="nums muted"><span>${fmtDate(s.fecha)} (${d === 0 ? "hoy" : d === 1 ? "ayer" : "hace " + d + " días"})</span><span>Total ${money(s.res.total)}</span><span>Pagó ${money(pg)}</span>${s.cuotas > 1 ? `<span>${s.cuotas} pagos de ${money(s.res.valorCuota)}</span>` : ""}</div>
      <div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap">${sd > 0.004 ? `<span class="pill warn">Debe ${money(sd)}</span>${d > 30 ? '<span class="pill bad">Más de 30 días</span>' : ""}` : '<span class="pill ok">Saldada</span>'}</div>
      ${open ? pagosHTML(s, false) : ""}</div>
    <div class="acts">${sd > 0.004 ? `<button class="btn sm primary" data-act="pago-new" data-id="${s.id}">${icon("cash")}Registrar pago</button>` : ""}<button class="btn sm" data-act="cc-toggle" data-id="${s.id}" aria-expanded="${open}">${open ? "Ocultar pagos" : "Ver pagos"}</button></div></div>`;
}
VIEWS.cuentas = {
  html() {
    const todas = state.sales.filter(s => s.medio === "ctacte" && !s.anulada);
    const deben = todas.filter(s => saldoVenta(s) > 0.004);
    const total = round2(deben.reduce((a, s) => a + saldoVenta(s), 0));
    const viejas = deben.filter(s => diasDesde(s.fecha) > 30).length;
    const [y, m] = todayISO().split("-"); const ini = `${y}-${m}-01`;
    const pagosMes = todas.flatMap(s => (s.pagos || []).filter(p => p.fecha >= ini && p.fecha <= todayISO()));
    const cobradoMes = round2(pagosMes.reduce((a, p) => a + p.monto, 0));
    const q = norm(cf.q);
    const lista = (cf.saldadas ? todas : deben).filter(s => !q || norm(s.cliente).includes(q));
    const grupos = {}; lista.forEach(s => { const k = norm(s.cliente) || "(sin nombre)"; (grupos[k] = grupos[k] || { nombre: s.cliente || "(sin nombre)", ventas: [] }).ventas.push(s); });
    const orden = Object.values(grupos).map(g => ({ ...g, deuda: round2(g.ventas.reduce((a, s) => a + saldoVenta(s), 0)) })).sort((a, b) => b.deuda - a.deuda || a.nombre.localeCompare(b.nombre, "es"));
    return `<div class="section-head"><div><h2>Cuenta corriente</h2><div class="muted small">Lo que te deben las clientas que se llevaron prendas para pagar después, con un ${pct(pval("recCtaCte") || 0)} de recargo.</div></div>
      <button class="btn primary no-print" data-act="cc-new">${icon("plus")}Nueva venta en cuenta corriente</button></div>
    <div class="kpis">
      <div class="panel kpi"><div class="lbl">Te deben</div><div class="val" style="color:var(--cc)">${money(total)}</div><div class="foot">Suma de todos los saldos</div>${stepsHTML([{ t: "Saldo de cada venta pendiente", f: deben.map(s => money(saldoVenta(s))).join(" + ") || "0", r: money(total), strong: true }], false, "Ver cálculo")}</div>
      <div class="panel kpi"><div class="lbl">Clientas que deben</div><div class="val">${new Set(deben.map(s => norm(s.cliente))).size}</div><div class="foot">${deben.length} ${deben.length === 1 ? "venta pendiente" : "ventas pendientes"}</div></div>
      <div class="panel kpi"><div class="lbl">Con más de 30 días</div><div class="val" style="color:${viejas ? "var(--bad)" : "inherit"}">${viejas}</div><div class="foot">Ventas para reclamar</div></div>
      <div class="panel kpi"><div class="lbl">Cobrado este mes</div><div class="val">${money(cobradoMes)}</div><div class="foot">${pagosMes.length} ${pagosMes.length === 1 ? "pago recibido" : "pagos recibidos"}</div>${stepsHTML([{ t: "Pagos de cuenta corriente desde el " + fmtDate(ini), f: pagosMes.map(p => money(p.monto)).join(" + ") || "0", r: money(cobradoMes), strong: true }], false, "Ver cálculo")}</div>
    </div>
    <div class="toolbar"><div class="search">${icon("search")}<input type="search" id="ccQ" placeholder="Buscar clienta" value="${esc(cf.q)}" aria-label="Buscar clienta"></div>
      <label class="check small"><input type="checkbox" id="ccSal" ${cf.saldadas ? "checked" : ""}> Mostrar también las saldadas</label></div>
    <div class="stack" id="ccList">${orden.length ? orden.map(g => `<section class="panel client"><div class="chead"><div><div class="cname">${esc(g.nombre)}</div><div class="small muted">${g.ventas.length} ${g.ventas.length === 1 ? "compra" : "compras"} en cuenta corriente</div></div>
        <div style="text-align:right"><div class="small muted">${g.deuda > 0.004 ? "Te debe" : "Al día"}</div><div class="cdebt">${money(g.deuda)}</div></div></div>
        ${g.ventas.sort((a, b) => a.fecha.localeCompare(b.fecha)).map(ccRow).join("")}</section>`).join("")
      : `<div class="panel empty"><h3>${todas.length ? "Nadie te debe nada" : "Todavía no hay ventas en cuenta corriente"}</h3><p>${todas.length ? "Todas las cuentas están saldadas." : "Cuando cargues una venta, elegí la forma de pago <b>Cuenta corriente</b>."}</p></div>`}</div>`;
  },
  mount() {
    let t = null;
    $("#ccQ").addEventListener("input", e => { cf.q = e.target.value; clearTimeout(t); t = setTimeout(() => { const pos = e.target.selectionStart; render(); const el = $("#ccQ"); el.focus(); el.setSelectionRange(pos, pos); }, 200); });
    $("#ccSal").addEventListener("change", e => { cf.saldadas = e.target.checked; render(); });
  }
};
function openPago(id) {

      <div class="lines"><div class="line"><span>Total de la venta</span><span>${money(s.res.total)}</span></div><div class="line"><span>Ya pagó</span><span>${money(pg)}</span></div><div class="line em" style="color:var(--cc)"><span>Debe</span><span>${money(sd)}</span></div></div></div>

      <div class="field"><label for="pg-medio">Paga con</label><select id="pg-medio">${Object.entries(PAGO_MEDIOS).map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select></div>
      <div class="field"><label for="pg-nota">Nota (opcional)</label><input type="text" id="pg-nota" maxlength="80" placeholder="Ej.: segundo pago"></div>
      <div class="field full"><span class="flabel">Atajos</span><div class="quick"><button type="button" class="btn sm" data-act="pago-fill" data-v="${sd}">Paga todo: ${money(sd)}</button>${s.res.valorCuota && s.res.valorCuota < sd ? `<button type="button" class="btn sm" data-act="pago-fill" data-v="${s.res.valorCuota}">Un pago: ${money(s.res.valorCuota)}</button>` : ""}</div></div>
    </div>
    <div class="suggest"><span class="muted">Después de este pago te debe</span><span class="big" id="pg-queda" style="color:var(--cc)"></span></div>

  $("#pg-monto").addEventListener("input", upd); upd();

async function descargar(nombre, contenido, mime) {

    case "exp-json": exportModal("Respaldo completo", `respaldo-stock-${todayISO()}.json`, JSON.stringify(state, null, 1), "application/json", null, "Guardá este archivo. Con “Restaurar un respaldo” recuperás todo en este u otro dispositivo."); break;
    case "copy-exp": copiar(window.__exp.copiable); break;
    case "dl-exp": descargar($("#modal").dataset.file, window.__exp.contenido, $("#modal").dataset.mime); break;
    case "imp-json": $("#importFile").click(); break;
    case "demo-load": {
      const ok = state.products.length || state.sales.length ? await confirmar({ titulo: "Cargar datos de ejemplo", texto: "Se reemplazan tus productos y ventas actuales por los de ejemplo. Si querés conservarlos, bajá antes un respaldo.", ok: "Reemplazar por ejemplos", peligro: true }) : true;
      if (ok) { const cfg = state.config, params = state.params; state = demoState(); state.config = Object.assign(state.config, { negocio: cfg.negocio, condIva: cfg.condIva, stockBajo: cfg.stockBajo, redondeo: cfg.redondeo }); state.params = params; cart = []; save(); render(); toast("Datos de ejemplo cargados"); }
      break; }
    case "demo-clear": {
      const ok = await confirmar({ titulo: "Empezar con tu stock", texto: "Se borran los productos y ventas de ejemplo. Los parámetros y la configuración se mantienen.", ok: "Borrar ejemplos" });
      if (ok) { state.products = []; state.sales = []; state.seq = 0; state.skuSeq = 0; state.demo = false; cart = []; save(); go("inventario"); render(); toast("Listo: cargá tu primer producto"); }
      break; }
    case "wipe": {
      const ok = await confirmar({ titulo: "Borrar todos los datos", texto: "Se borran <b>todos</b> los productos, ventas, parámetros y configuración guardados en este navegador. <b>No se puede deshacer.</b> Si querés conservarlos, bajá antes un respaldo.", ok: "Borrar todo", peligro: true });
      if (ok) { try { localStorage.removeItem(STORE_KEY); } catch (_) {} state = emptyState(); cart = []; setMedio("efectivo"); save(); go("inventario"); render(); toast("Se borraron todos los datos"); }
      break; }
  }
});
$("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#overlay").hidden) closeModal(false); });
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

/* Datos iniciales: pueden venir cifrados dentro de la página y se abren solo con la clave del link (?clave=...).
   Se cargan una única vez, y solo si en este navegador no hay datos propios. */
const IMPORT_FLAG = STORE_KEY + ".datos-iniciales";
function b64urlBytes(t) { t = t.replace(/-/g, "+").replace(/_/g, "/"); while (t.length % 4) t += "="; const bin = atob(t); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
async function cargarDatosIniciales() {
  const el = document.getElementById("datosIniciales"); if (!el) return;
  let clave = null; try { clave = new URLSearchParams(location.search).get("clave"); } catch (_) {}
  if (!clave) return;
  let pkg; try { pkg = JSON.parse(el.textContent); } catch (_) { return; }
  let ya = null; try { ya = localStorage.getItem(IMPORT_FLAG); } catch (_) {}
  const sinDatosPropios = state.demo || (!state.products.length && !state.sales.length);
  if (ya === pkg.id || !sinDatosPropios) return;
  try {
    if (!(window.crypto && crypto.subtle)) throw new Error("sin cifrado");
    const key = await crypto.subtle.importKey("raw", b64urlBytes(clave), "AES-GCM", false, ["decrypt"]);
    const plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64urlBytes(pkg.iv) }, key, b64urlBytes(pkg.ct));
    state = normalizeState(JSON.parse(new TextDecoder().decode(plano)));
    cart = []; setMedio("efectivo"); save();
    try { localStorage.setItem(IMPORT_FLAG, pkg.id); } catch (_) {}
    render(); toast(`Listo: se cargaron ${intFmt(state.products.length)} productos y ${intFmt(state.sales.length)} ventas`);
  } catch (e) { toast("No se pudieron abrir los datos: la clave del link no es correcta.", "warn"); }
}
render();
cargarDatosIniciales();
</script>
